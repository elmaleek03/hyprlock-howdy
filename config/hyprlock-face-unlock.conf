# Add this to your ~/.config/hypr/hyprlock.conf
#
# IMPORTANT: You must also set ignore_empty_input = false in the general section.

# Face unlock status label
label {
    monitor =
    text = smile at the camera :)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    color = $font_color

    position = 0, -80
    halign = center
    valign = center
}

# Trigger face unlock automatically when hyprlock starts
label {
    monitor =
    text = cmd[update:999999] omarchy-face-unlock
    font_size = 1
    color = rgba(0, 0, 0, 0)

    position = 0, 0
    halign = center
    valign = center
}
